# Override de desarrollo: hot-reload de la web sin rebuild.
# Monta el codigo fuente y preserva node_modules del contenedor.
# WATCHPACK_POLLING=true -> necesario para detectar cambios en bind mounts Windows.
services:
  web:
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
