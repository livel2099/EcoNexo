# EcoNexo — ecosistema completo para desarrollo local.
# `docker compose up` levanta: PostGIS, Mosquitto, MinIO, FastAPI core,
# microservicios Node (ingest/notify), servicios IA (anomaly/satellite),
# web Next.js y el simulador de nodos ESP32.
#
# Mapeo local -> AWS (ver README):
#   postgis  -> RDS PostgreSQL + PostGIS
#   mosquitto-> AWS IoT Core (MQTT)
#   minio    -> S3
#   api/web/services -> EKS (ver /k8s) o ECS
#   simulator/anomaly cron -> Lambda + EventBridge

name: econexo

x-db-env: &db-env
  POSTGRES_HOST: postgis
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-econexo}
  POSTGRES_USER: ${POSTGRES_USER:-econexo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-econexo_dev_pw}

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-econexo}
      POSTGRES_USER: ${POSTGRES_USER:-econexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-econexo_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-econexo} -d ${POSTGRES_DB:-econexo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-econexo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-econexo_dev_pw}
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-econexo} ${MINIO_ROOT_PASSWORD:-econexo_dev_pw} &&
      mc mb -p local/${S3_BUCKET:-econexo-reports} &&
      mc anonymous set download local/${S3_BUCKET:-econexo-reports} &&
      echo 'bucket ready';
      "

  api:
    build: ./apps/api
    environment:
      <<: *db-env
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change_me_internal_dev_secret}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-econexo-reports}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-econexo}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-econexo_dev_pw}
      ANOMALY_SERVICE_URL: http://anomaly:8100
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  ingest:
    build: ./services/ingest
    environment:
      <<: *db-env
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      ANOMALY_SERVICE_URL: http://anomaly:8100
      API_URL: http://api:8000
    depends_on:
      postgis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      api:
        condition: service_started

  notify:
    build: ./services/notify
    environment:
      <<: *db-env
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      PORT: "8200"
    ports:
      - "8200:8200"
    depends_on:
      postgis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  anomaly:
    build: ./services/anomaly
    environment:
      <<: *db-env
      PORT: "8100"
    ports:
      - "8100:8100"
    depends_on:
      postgis:
        condition: service_healthy

  satellite:
    build: ./services/satellite
    environment:
      <<: *db-env
      NASA_FIRMS_KEY: ${NASA_FIRMS_KEY:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change_me_internal_dev_secret}
      API_URL: http://api:8000
      FIRMS_POLL_SECONDS: ${FIRMS_POLL_SECONDS:-900}
    depends_on:
      postgis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_MAP_PROVIDER: ${MAP_PROVIDER:-leaflet}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      NODE_COUNT: ${SIM_NODE_COUNT:-0}
      API_URL: http://api:8000
    depends_on:
      mosquitto:
        condition: service_started
      api:
        condition: service_started
    profiles: ["sim"]

volumes:
  pgdata:
  minio-data:
