# EcoNexo rc.6.2 - Blueprint beta funcional para Render.
# Crea PostgreSQL, API FastAPI y frontend Next.js exportado como Static Site.
databases:
  - name: econexo-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: econexo
    user: econexo_app
    ipAllowList: []

services:
  - type: web
    name: econexo
    runtime: docker
    plan: free
    region: oregon
    rootDir: apps/api
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RELEASE_VERSION
        value: 1.0.0-rc.6.2-render
      - key: DATABASE_URL
        fromDatabase:
          name: econexo-db
          property: connectionString
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_COMMAND_TIMEOUT_SECONDS
        value: "30"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PUBLIC_APP_URL
        value: https://econexo-web.onrender.com
      - key: CORS_ORIGINS
        value: https://econexo-web.onrender.com
      - key: ECONEXO_WEB_ORIGIN
        value: https://econexo-web.onrender.com
      - key: PLATFORM_ADMIN_EMAILS
        value: econexoargentina@gmail.com
      - key: PLATFORM_ADMIN_BOOTSTRAP_ENABLED
        value: "false"
      - key: PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE
        value: "true"
      - key: PLATFORM_ADMIN_RESET_INITIAL_PASSWORD
        value: "false"
      - key: PLATFORM_ADMIN_NAME
        value: Administrador General EcoNexo
      - key: PLATFORM_ADMIN_ORGANIZATION
        value: EcoNexo Plataforma
      - key: SALES_EMAIL
        value: econexoargentina@gmail.com
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_IDS
        value: ""
      - key: MQTT_ENABLED
        value: "false"
      - key: ANOMALY_ENABLED
        value: "false"
      - key: S3_ENABLED
        value: "false"
      - key: OPEN_METEO_FORECAST_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: COPERNICUS_ENABLED_BY_DEFAULT
        value: "true"
      - key: COPERNICUS_MODE
        value: process_api
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: COPERNICUS_TOKEN_URL
        value: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
      - key: COPERNICUS_PROCESS_URL
        value: https://sh.dataspace.copernicus.eu/process/v1
      - key: COPERNICUS_INSTANCE_ID
        sync: false
      - key: COPERNICUS_WMS_URL
        sync: false
      - key: COPERNICUS_HTTP_TIMEOUT_SECONDS
        value: "45"
      - key: COPERNICUS_TIME_RANGE_DAYS
        value: "90"
      - key: COPERNICUS_MAX_CLOUD_COVERAGE
        value: "80"
      - key: COPERNICUS_MAX_DIMENSION
        value: "1024"
      - key: COPERNICUS_CACHE_SECONDS
        value: "600"
      - key: NASA_FIRMS_KEY
        sync: false
      - key: FIRMS_INLINE_ENABLED
        value: "true"
      - key: FIRMS_SOURCE
        value: VIIRS_SNPP_NRT
      - key: PIPELINE_MAX_DEVICES_PER_RUN
        value: "100"
      - key: PIPELINE_HTTP_TIMEOUT_SECONDS
        value: "20"

  - type: web
    name: econexo-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run typecheck && npm run build:cloudflare:production
    staticPublishPath: out
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://econexo.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://econexo.onrender.com
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_STATIC_EXPORT
        value: "true"
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: ""
      - key: NEXT_PUBLIC_OPEN_METEO_FORECAST_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: NEXT_PUBLIC_OPEN_METEO_AIR_URL
        value: https://air-quality-api.open-meteo.com/v1/air-quality
      - key: NEXT_PUBLIC_OPEN_METEO_FLOOD_URL
        value: https://flood-api.open-meteo.com/v1/flood
      - key: NEXT_PUBLIC_COPERNICUS_WMS_URL
        value: ""
      - key: NEXT_PUBLIC_APP_URL
        value: https://econexo-web.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
