# Render Blueprint para beta funcional (sin MQTT, IA externa ni S3).
# Para produccion paga usar render.production.yaml.
databases:
  - name: econexo-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: econexo
    user: econexo_app
    ipAllowList: []

services:
  - type: web
    name: econexo-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: apps/api
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RELEASE_VERSION
        value: 1.0.0-rc.5-render
      - key: DATABASE_URL
        fromDatabase:
          name: econexo-db
          property: connectionString
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PUBLIC_APP_URL
        value: https://econexo-web.onrender.com
      - key: CORS_ORIGINS
        value: https://econexo-web.onrender.com
      - key: PLATFORM_ADMIN_EMAILS
        value: econexoargentina@gmail.com
      - key: PLATFORM_ADMIN_BOOTSTRAP_ENABLED
        value: "true"
      - key: PLATFORM_ADMIN_INITIAL_PASSWORD
        sync: false
      - key: PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE
        value: "true"
      - key: PLATFORM_ADMIN_RESET_INITIAL_PASSWORD
        value: "true"
      - key: PLATFORM_ADMIN_NAME
        value: Administrador General EcoNexo
      - key: PLATFORM_ADMIN_ORGANIZATION
        value: EcoNexo Plataforma
      - key: SALES_EMAIL
        value: econexoargentina@gmail.com
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_IDS
        value: ""
      - key: MQTT_ENABLED
        value: "false"
      - key: ANOMALY_ENABLED
        value: "false"
      - key: S3_ENABLED
        value: "false"
