# EcoNexo rc.6 - Blueprint de producción para Render.
databases:
  - name: econexo-db
    plan: basic-256mb
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    region: oregon
    postgresMajorVersion: "16"
    databaseName: econexo
    user: econexo_app
    ipAllowList: []

services:
  - type: web
    name: econexo-api
    runtime: docker
    plan: starter
    region: oregon
    rootDir: apps/api
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    preDeployCommand: python -m app.migrate
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RELEASE_VERSION
        value: 1.0.0-rc.6-render
      - key: DATABASE_URL
        fromDatabase:
          name: econexo-db
          property: connectionString
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "10"
      - key: DB_COMMAND_TIMEOUT_SECONDS
        value: "30"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PUBLIC_APP_URL
        value: https://econexo-web.onrender.com
      - key: CORS_ORIGINS
        value: https://econexo-web.onrender.com
      - key: PLATFORM_ADMIN_EMAILS
        value: econexoargentina@gmail.com
      - key: PLATFORM_ADMIN_BOOTSTRAP_ENABLED
        value: "true"
      - key: PLATFORM_ADMIN_INITIAL_PASSWORD
        sync: false
      - key: PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE
        value: "true"
      - key: PLATFORM_ADMIN_RESET_INITIAL_PASSWORD
        value: "true"
      - key: PLATFORM_ADMIN_NAME
        value: Administrador General EcoNexo
      - key: PLATFORM_ADMIN_ORGANIZATION
        value: EcoNexo Plataforma
      - key: SALES_EMAIL
        value: econexoargentina@gmail.com
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_IDS
        value: ""
      - key: MQTT_ENABLED
        value: "false"
      - key: ANOMALY_ENABLED
        value: "false"
      - key: S3_ENABLED
        value: "false"
      - key: OPEN_METEO_FORECAST_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: NASA_FIRMS_KEY
        sync: false
      - key: FIRMS_INLINE_ENABLED
        value: "true"
      - key: FIRMS_SOURCE
        value: VIIRS_SNPP_NRT
      - key: PIPELINE_MAX_DEVICES_PER_RUN
        value: "250"
      - key: PIPELINE_HTTP_TIMEOUT_SECONDS
        value: "20"

  - type: web
    name: econexo-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run typecheck && npm run build:cloudflare:production
    staticPublishPath: out
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://econexo-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://econexo-api.onrender.com
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_STATIC_EXPORT
        value: "true"
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: ""
      - key: NEXT_PUBLIC_OPEN_METEO_FORECAST_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: NEXT_PUBLIC_OPEN_METEO_AIR_URL
        value: https://air-quality-api.open-meteo.com/v1/air-quality
      - key: NEXT_PUBLIC_OPEN_METEO_FLOOD_URL
        value: https://flood-api.open-meteo.com/v1/flood
      - key: NEXT_PUBLIC_COPERNICUS_WMS_URL
        value: ""
      - key: NEXT_PUBLIC_APP_URL
        value: https://econexo-web.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
