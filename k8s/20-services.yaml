# Microservicios IA/IoT: anomaly (svc), ingest (worker), notify (svc), satellite (worker/cron).
apiVersion: apps/v1
kind: Deployment
metadata: { name: anomaly, namespace: econexo }
spec:
  replicas: 1
  selector: { matchLabels: { app: anomaly } }
  template:
    metadata: { labels: { app: anomaly } }
    spec:
      containers:
        - name: anomaly
          image: econexo/anomaly:latest
          ports: [{ containerPort: 8100 }]
          envFrom:
            - configMapRef: { name: econexo-config }
            - secretRef: { name: econexo-secrets }
---
apiVersion: v1
kind: Service
metadata: { name: anomaly, namespace: econexo }
spec:
  selector: { app: anomaly }
  ports: [{ port: 8100, targetPort: 8100 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingest, namespace: econexo }
spec:
  replicas: 2
  selector: { matchLabels: { app: ingest } }
  template:
    metadata: { labels: { app: ingest } }
    spec:
      containers:
        - name: ingest
          image: econexo/ingest:latest
          envFrom:
            - configMapRef: { name: econexo-config }
            - secretRef: { name: econexo-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notify, namespace: econexo }
spec:
  replicas: 1
  selector: { matchLabels: { app: notify } }
  template:
    metadata: { labels: { app: notify } }
    spec:
      containers:
        - name: notify
          image: econexo/notify:latest
          ports: [{ containerPort: 8200 }]
          envFrom:
            - configMapRef: { name: econexo-config }
            - secretRef: { name: econexo-secrets }
---
apiVersion: v1
kind: Service
metadata: { name: notify, namespace: econexo }
spec:
  selector: { app: notify }
  ports: [{ port: 8200, targetPort: 8200 }]
---
# Ingesta satelital programada (equivale a Lambda + EventBridge).
apiVersion: batch/v1
kind: CronJob
metadata: { name: satellite, namespace: econexo }
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: satellite
              image: econexo/satellite:latest
              command: ["python", "-m", "app.main"]
              envFrom:
                - configMapRef: { name: econexo-config }
                - secretRef: { name: econexo-secrets }
