apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: econexo
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: econexo/api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: econexo-config }
            - secretRef: { name: econexo-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: econexo
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
