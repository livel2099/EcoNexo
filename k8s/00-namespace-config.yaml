# EcoNexo — namespace + configuracion compartida.
# Secretos reales via Secrets Manager/SSM (aca solo placeholders no sensibles).
apiVersion: v1
kind: Namespace
metadata:
  name: econexo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: econexo-config
  namespace: econexo
data:
  POSTGRES_HOST: "postgis"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "econexo"
  MQTT_HOST: "mosquitto"
  MQTT_PORT: "1883"
  ANOMALY_SERVICE_URL: "http://anomaly:8100"
  API_URL: "http://api:8000"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "econexo-reports"
  CORS_ORIGINS: "http://localhost:3000"
  FIRMS_POLL_SECONDS: "900"
---
apiVersion: v1
kind: Secret
metadata:
  name: econexo-secrets
  namespace: econexo
type: Opaque
stringData:
  POSTGRES_USER: "econexo"
  POSTGRES_PASSWORD: "REEMPLAZAR"
  JWT_SECRET: "REEMPLAZAR"
  S3_ACCESS_KEY: "REEMPLAZAR"
  S3_SECRET_KEY: "REEMPLAZAR"
  NASA_FIRMS_KEY: ""
