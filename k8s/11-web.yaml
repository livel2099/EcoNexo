apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: econexo
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: econexo/web:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NEXT_PUBLIC_API_URL, value: "https://api.econexo.example" }
            - { name: NEXT_PUBLIC_WS_URL, value: "wss://api.econexo.example" }
            - { name: NEXT_PUBLIC_MAP_PROVIDER, value: "leaflet" }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: econexo
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
