# Mosquitto — broker MQTT de desarrollo para EcoNexo.
# Topics: econexo/{org_id}/{device_id}/telemetry
#         econexo/{org_id}/{device_id}/status
listener 1883
protocol mqtt

# Puerto websockets (para clientes browser/diagnostico).
listener 9001
protocol websockets

# Dev: acceso anonimo. En prod usar credenciales por dispositivo
# (mapea a AWS IoT Core con certs X.509 / policies por device).
allow_anonymous true
persistence false
log_dest stdout
log_type warning
